name: cultural_learning_app
description: A production-ready mobile-first cultural learning Progressive Web App in Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_card_swiper: ^7.0.0
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.6.1   # Matches your current state management
  camera: ^0.11.3+1
  image_picker: ^1.1.2 # <-- A         # For hardware camera control & viewfinder
  google_generative_ai: ^0.4.7 # Officia
  firebase_core: ^3.11.0
  cloud_firestore: ^5.6.2
  cloud_functions: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/